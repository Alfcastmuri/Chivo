name: Construir GESTOR.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      # El cargador precompilado de PyInstaller lo comparten miles de programas (también malware),
      # y por eso algunos antivirus lo bloquean. Compilarlo aquí genera un .exe propio.
      - name: Instalar PyInstaller con cargador compilado desde el código fuente
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller==6.11.1

      - name: Construir el .exe
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name GESTOR --version-file version_info.txt --add-data "app/panel.html;." --paths app app/gestor.py

      - name: Comprobar que el motor arranca
        shell: pwsh
        run: |
          $env:GESTOR_DATOS = "$env:RUNNER_TEMP\gestor-datos"
          Start-Process -FilePath dist\GESTOR\GESTOR.exe -ArgumentList "--motor" -Wait
          if (-not (Test-Path "$env:GESTOR_DATOS\servicios.json")) { throw "El motor no creó servicios.json" }
          if (Test-Path "$env:GESTOR_DATOS\errores.log") { Get-Content "$env:GESTOR_DATOS\errores.log"; throw "El motor registró errores" }

      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GESTOR -DestinationPath GESTOR-windows.zip
          New-Item -ItemType Directory -Path GESTOR-python | Out-Null
          Copy-Item app\*.py, app\*.pyw, app\panel.html -Destination GESTOR-python
          Compress-Archive -Path GESTOR-python -DestinationPath GESTOR-python.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GESTOR-windows
          path: GESTOR-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GESTOR-python
          path: GESTOR-python.zip

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GESTOR-windows.zip
            GESTOR-python.zip
