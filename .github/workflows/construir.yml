name: Construir GESTOR.exe

on:
  push:
    branches: [main, publicar]  # empujar a «publicar» crea la versión en Releases (la actualización automática la busca ahí)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerías opcionales (fotos, PDF, al instante, icono)
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      # El cargador precompilado de PyInstaller lo comparten miles de programas (también malware),
      # y por eso algunos antivirus lo bloquean. Compilarlo aquí genera un .exe propio.
      - name: Probar el OCR de Windows (informativo)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:GESTOR_DATOS = "$env:RUNNER_TEMP\gestor-ocr"
          python -c "from PIL import Image, ImageDraw, ImageFont; i = Image.new('RGB', (1800, 600), 'white'); d = ImageDraw.Draw(i); d.text((60, 200), 'FECHA LIMITE DE PAGO 15 NOV 26', fill='black', font=ImageFont.truetype('arial.ttf', 80)); i.save('recibo.bmp')"
          python -c "import sys; sys.path.insert(0, 'app'); import ocr, bd; print('Idiomas/estado:', ocr.estado()); print('Texto leído:', repr(ocr.texto('recibo.bmp'))); print(bd.leer('ocr:error', None))"

      - name: Instalar PyInstaller con cargador compilado desde el código fuente
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller==6.11.1

      - name: Construir el .exe
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name GESTOR --version-file version_info.txt --add-data "app/panel.html;." --add-data "app/login.html;." --hidden-import pystray._win32 --hidden-import watchdog.observers.read_directory_changes --collect-submodules pillow_heif --paths app app/gestor.py

      - name: Comprobar que el motor arranca
        shell: pwsh
        run: |
          $env:GESTOR_DATOS = "$env:RUNNER_TEMP\gestor-datos"
          $env:GESTOR_SIN_RESIDENTE = "1"
          $p = Start-Process -FilePath dist\GESTOR\GESTOR.exe -ArgumentList "--motor" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "El motor no terminó" }
          if (-not (Test-Path "$env:GESTOR_DATOS\gestor.db")) { throw "El motor no creó la base de datos" }
          if (Test-Path "$env:GESTOR_DATOS\errores.log") { Get-Content "$env:GESTOR_DATOS\errores.log"; throw "El motor registró errores" }

      - name: Comprobar el modo al instante
        shell: pwsh
        run: |
          $datos = "$env:RUNNER_TEMP\gestor-instante"
          $origen = "$env:RUNNER_TEMP\origen"; $destino = "$env:RUNNER_TEMP\destino"
          New-Item -ItemType Directory -Force -Path $datos, $origen | Out-Null
          $servicio = @{ id = "prueba"; nombre = "Prueba"; activo = $true; origenes = @($origen); subcarpetas = $false
                         horario = @{ tipo = "instante" }; conflicto = "renombrar"; esperar_minutos = 0; ignorar = @()
                         reglas = @(@{ si = @{}; accion = "mover"; destino = $destino }) }
          ConvertTo-Json -Depth 6 @($servicio) | Set-Content -Encoding utf8 "$datos\servicios.json"
          $env:GESTOR_DATOS = $datos
          $env:GESTOR_PUERTO_RESIDENTE = "8799"
          $p = Start-Process -FilePath dist\GESTOR\GESTOR.exe -ArgumentList "--residente", "--sin-icono" -PassThru
          Start-Sleep -Seconds 5
          Set-Content -Path "$origen\nuevo.txt" -Value "hola"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 1; if (Test-Path "$destino\nuevo.txt") { $ok = $true; break } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "$datos\errores.log") { Get-Content "$datos\errores.log" }
          if (-not $ok) { throw "El modo al instante no movió el archivo" }

      - name: Comprobar las órdenes de mantenimiento
        shell: pwsh
        run: |
          $env:GESTOR_DATOS = "$env:RUNNER_TEMP\gestor-datos"
          $env:GESTOR_SIN_RESIDENTE = "1"
          $p = Start-Process -FilePath dist\GESTOR\GESTOR.exe -ArgumentList "--respaldar-base", "$env:RUNNER_TEMP\respaldos" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:GESTOR_DATOS\mantenimiento.log"; throw "--respaldar-base falló" }
          if (-not (Get-ChildItem "$env:RUNNER_TEMP\respaldos\gestor *.db")) { throw "No se creó el respaldo de la base" }
          $p = Start-Process -FilePath dist\GESTOR\GESTOR.exe -ArgumentList "--detener" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:GESTOR_DATOS\mantenimiento.log"; throw "--detener falló" }

      - name: Crear el instalador
        shell: pwsh
        run: |
          $version = (Select-String -Path app\nucleo.py -Pattern 'VERSION = "(.+?)"').Matches[0].Groups[1].Value
          "GESTOR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=$version" instalador\gestor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }

      - name: Probar el instalador (instalar y desinstalar en silencio)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:GESTOR_DATOS = "$env:RUNNER_TEMP\gestor-instalado"
          # Sin -Wait: esperaría también al icono de GESTOR que el instalador deja abierto.
          $p = Start-Process -FilePath "salida\GESTOR-Instalador-$env:GESTOR_VERSION.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "La instalación falló ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\GESTOR"
          if (-not (Test-Path "$app\GESTOR.exe")) { throw "No se instaló GESTOR.exe" }
          if (-not (Test-Path "$app\instalador\GESTOR-Instalador.exe")) { throw "Falta la copia del instalador" }
          Get-Process GESTOR -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru
          $p.WaitForExit()
          # El desinstalador se copia a TEMP y sigue desde ahí: se espera a que termine de borrar.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\GESTOR.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\GESTOR.exe") { throw "La desinstalación no quitó GESTOR.exe" }

      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GESTOR -DestinationPath GESTOR-windows.zip
          New-Item -ItemType Directory -Path GESTOR-python | Out-Null
          Copy-Item app\*.py, app\*.pyw, app\*.html, requirements.txt -Destination GESTOR-python
          Compress-Archive -Path GESTOR-python -DestinationPath GESTOR-python.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GESTOR-windows
          path: GESTOR-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GESTOR-Instalador
          path: salida/GESTOR-Instalador-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GESTOR-python
          path: GESTOR-python.zip

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/publicar'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GESTOR_VERSION }}
          name: GESTOR ${{ env.GESTOR_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: instalador/novedades.md
          make_latest: true
          files: |
            salida/GESTOR-Instalador-*.exe
            GESTOR-windows.zip
            GESTOR-python.zip
